# Public address of the site (GitHub Pages). Keep the trailing slash.
baseURL = "https://csml-uci.github.io/"
languageCode = "en-us"
title = "Computational Solid Mechanics Lab @ UCI"

# This site has no category or tag index pages.
disableKinds = ["taxonomy", "term"]

# Keep Finder metadata files out of the published site.
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
    files = ['! **/.DS_Store']

[params]
  lab_name = "Computational Solid Mechanics Lab @ UCI"
  university = "University of California, Irvine"
  department = "Department of Mechanical and Aerospace Engineering"
  pi_name = "Prof. Julián J. Rimoli"
  pi_image = "/images/team/pi.jpg"
  email = "jrimoli@uci.edu"
  description = "Where mechanics of structures and materials meet advanced numerical methods."

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Team"
    url = "/team/"
    weight = 2
  [[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 3
  [[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 4
  [[menu.main]]
    name = "Teaching"
    url = "/teaching/"
    weight = 5
  [[menu.main]]
    name = "News"
    url = "/news/"
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
