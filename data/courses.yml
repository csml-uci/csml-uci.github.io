# Current Courses
# Edit this section to add/update current courses

current:
  - title: "MAE 157 - Lightweight Structures"
    level: "undergraduate"
    description: |
      Design and calculation of aerospace structures, with focus on semi-monocoque designs.

  - title: "MAE 195/295 - Introduction to the Finite Element Method"
    level: "undergraduate/graduate"
    description: |
      Project-based course on the fundamentals of the finite element method with application to stress analysis problems.

  - title: "MAE 254 - Mechanics of Solids"
    level: "graduate"
    term: "Fall 2026"
    description: |
      Finite deformation kinematics; stress and strain measures; invariance in solid mechanics; objective rates; constitutive theory of elastic and inelastic solids; rate formulations; computational approaches; theories of plates and shells; applications to aerospace vehicles.

